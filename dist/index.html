<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover keeps the fixed background layers flush behind
         notches/rounded corners. Zoom is deliberately NOT disabled (that would
         be an accessibility regression) — the layout is made zoom-stable in
         CSS instead, via svh units and containment on the fixed layers. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Invisos</title>
    <!-- Apply the theme BEFORE first paint to prevent a flash on refresh -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("invisos-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          var root = document.documentElement;
          if (t === "dark") root.classList.add("dark");
          root.style.colorScheme = t;
          root.style.background = t === "dark" ? "#16161f" : "#E3E1EA";
          var m = document.createElement("meta");
          m.name = "theme-color";
          m.content = t === "dark" ? "#16161f" : "#E3E1EA";
          document.head.appendChild(m);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Team Invisos builds world-class digital experiences with exceptional attention to detail."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>

</html>
